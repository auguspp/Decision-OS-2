name: decision-os-ashare-data
run-name: ${{ inputs.operation == 'ftshare-check' && 'FTShare daily check 20261018' || 'decision-os-ashare-data' }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, sync, repair, ftshare-check]
        default: status
        required: true
        description: 'Read records, advance Relay partitions, or explicitly qualify the user-selected FTShare daily source'
      code_sha:
        type: string
        required: true
        description: 'Exact reviewed current main commit'
      selection:
        type: string
        required: true
        description: 'JSON collection_id/generation/start/end/calendar_end, optional refresh_dates; <=6000 bytes'
      work_units:
        type: string
        default: '1'
        description: '1..32 finite sync/repair units; status requires 1; retained page retry budgets survive every unit'
      repair_request:
        type: string
        default: ''
        description: 'Repair only: exact ashare-terminal-repair-request-v1 JSON <=16000 bytes for first grant; empty resumes the retained grant'
      access_and_custody_confirmed:
        type: boolean
        default: false
        description: 'Authorize this exact source access and storage scope; does not grant publication rights'
      public_rights_confirmed:
        type: boolean
        default: false
        description: 'Required for PUBLIC records. A native-verified PRIVATE repository instead uses the custody authorization'
permissions: {}
concurrency:
  group: decision-os-relay-source
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Read the existing records collection with native privacy verification and no source access
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the source-free status receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  rejected-sync:
    if: >-
      github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'sync' && (inputs.access_and_custody_confirmed != true ||
      (github.event.repository.private != true && inputs.public_rights_confirmed != true))) ||
      (inputs.operation == 'repair' && (inputs.access_and_custody_confirmed != true || github.event.repository.private != true)) ||
      (inputs.operation == 'ftshare-check' && (inputs.access_and_custody_confirmed != true || github.event.repository.private != true || inputs.public_rights_confirmed != false)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail before source access when the selected operation lacks its access or visibility gate
        run: |
          echo "::error::ASHARE_PUBLIC_RIGHTS_REQUIRED_OR_ACCESS_NOT_CONFIRMED"
          exit 1
  sync:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'sync' && inputs.access_and_custody_confirmed == true && (github.event.repository.private == true || inputs.public_rights_confirmed == true)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Advance explicitly authorized records with native privacy recheck and per-page checkpoints
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the engineering counts receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  repair:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'repair' && inputs.access_and_custody_confirmed == true && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Consume only the explicit retained repair grant after native transport and query evidence checks
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the engineering repair counts receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  ftshare-check:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'ftshare-check' && inputs.access_and_custody_confirmed == true && github.event.repository.private == true && inputs.public_rights_confirmed == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Verify private native execution and reuse the exact stored comparison universe
        id: prepare
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.ftshare_check_cli prepare --out "$RUNNER_TEMP/dos2-ftshare-check"
      - name: Qualify the selected FTShare daily endpoint with at most six source requests
        id: capture
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
        run: python -m decision_kernel.interfaces.ftshare_check_cli capture --out "$RUNNER_TEMP/dos2-ftshare-check"
      - name: Recheck native privacy before releasing original diagnostic bytes
        if: always() && steps.prepare.outcome == 'success'
        id: release
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.ftshare_check_cli release --out "$RUNNER_TEMP/dos2-ftshare-check"
      - name: Retain the original finite check and its actual failures in the same private repository
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ftshare-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ftshare-check/
          if-no-files-found: error
          retention-days: 30
