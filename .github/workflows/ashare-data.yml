name: decision-os-ashare-data
run-name: decision-os-ashare-data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, sync, repair, ftshare-sync, ftshare-status]
        default: ftshare-status
        required: true
        description: 'Read records, advance the trusted finite Kernel v1 whole-range plan, or repair the retained grant; the dated one-off checks are not offered here'
      code_sha:
        type: string
        required: true
        description: 'Exact reviewed current main commit'
      selection:
        type: string
        default: '{"collection_id":"ftshare-cn-eod","generation":"g20261016-v1"}'
        required: true
        description: 'FTShare: trusted finite collection_id/generation; <=6000 bytes'
      work_units:
        type: string
        default: '1'
        description: '1..32 finite sync/repair units; status and Kernel adoption require 1; retained page retry budgets survive every unit'
      repair_request:
        type: string
        default: ''
        description: 'Repair only: exact ashare-terminal-repair-request-v1 JSON <=16000 bytes for first grant; empty resumes the retained grant'
      access_and_custody_confirmed:
        type: boolean
        default: false
        description: 'Authorize this exact source access and storage scope; does not grant publication rights'
      public_rights_confirmed:
        type: boolean
        default: false
        description: 'Optional per-call public rights for legacy Relay sync; normal FTShare uses the reviewed public-runtime deployment authorization; keep historical control flags unchanged'
permissions: {}
concurrency:
  group: decision-os-relay-source
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Read the existing records collection with native privacy verification and no source access
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the source-free status receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  rejected-sync:
    if: >-
      github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'sync' && inputs.access_and_custody_confirmed != true) ||
      (inputs.operation == 'repair' && (inputs.access_and_custody_confirmed != true || github.event.repository.private != true)) ||
      (inputs.operation == 'ftshare-sync' && inputs.access_and_custody_confirmed != true) ||
      ((inputs.operation == 'ftshare-sync' || inputs.operation == 'ftshare-status') && inputs.public_rights_confirmed != false))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail before source access when the selected operation lacks its access or visibility gate
        run: |
          echo "::error::ASHARE_PUBLIC_RIGHTS_REQUIRED_OR_ACCESS_NOT_CONFIRMED"
          exit 1
  sync:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'sync' && inputs.access_and_custody_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Check native visibility and owner publication authority before source admission
        if: inputs.public_rights_confirmed != true
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.infrastructure.runtime_publication check sources
      - name: Advance explicitly authorized records with native privacy recheck and per-page checkpoints
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the engineering counts receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  repair:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'repair' && inputs.access_and_custody_confirmed == true && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Consume only the explicit retained repair grant after native transport and query evidence checks
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the engineering repair counts receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  ftshare-sync:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'ftshare-sync' && inputs.access_and_custody_confirmed == true && inputs.public_rights_confirmed == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Check native visibility and owner publication authority before source admission
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.infrastructure.runtime_publication check sources
      - name: Retain bounded FTShare whole-range daily requests and irreversible per-slot reservations
        id: runtime
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
        run: python -m decision_kernel.interfaces.ftshare_collection_cli runtime --out "$RUNNER_TEMP/dos2-ftshare-collection"
      - name: Recheck native publication before releasing exact reading references
        if: always()
        id: release
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.infrastructure.runtime_publication check market
      - name: Preserve the authorized result and exact reading control
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ftshare-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ftshare-collection/
          if-no-files-found: error
          retention-days: 30
  ftshare-status:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'ftshare-status' && inputs.public_rights_confirmed == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Check native visibility and owner publication authority before source admission
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.infrastructure.runtime_publication check market
      - name: Read the retained FTShare collection without source credentials
        id: runtime
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.ftshare_collection_cli runtime --out "$RUNNER_TEMP/dos2-ftshare-collection"
      - name: Recheck native publication before releasing exact reading references
        if: always()
        id: release
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.infrastructure.runtime_publication check market
      - name: Preserve the authorized result and exact reading control
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ftshare-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ftshare-collection/
          if-no-files-found: error
          retention-days: 30