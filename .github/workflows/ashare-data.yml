name: decision-os-ashare-data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, sync]
        default: status
        required: true
        description: 'Read public records health or advance only licensed SH/SZ daily partitions'
      code_sha:
        type: string
        required: true
        description: 'Exact reviewed current main commit'
      selection:
        type: string
        required: true
        description: 'JSON collection_id/generation/start/end/calendar_end, optional refresh_dates; <=6000 bytes'
      work_units:
        type: string
        default: '1'
        description: '1..32 finite sync units; status requires 1; original page retry budget survives every unit'
      access_and_custody_confirmed:
        type: boolean
        default: false
        description: 'Authorize this exact source access and storage scope; does not grant publication rights'
      public_rights_confirmed:
        type: boolean
        default: false
        description: 'Separate verified permission to publicly redistribute ALL selected source rows; never infer from access'
permissions: {}
concurrency:
  group: decision-os-relay-source
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Read the existing public records collection without source access
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the source-free status receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
  rejected-sync:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'sync' && (inputs.access_and_custody_confirmed != true || inputs.public_rights_confirmed != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail without source access when public redistribution rights are not established
        run: |
          echo "::error::ASHARE_PUBLIC_RIGHTS_REQUIRED_OR_ACCESS_NOT_CONFIRMED"
          exit 1
  sync:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.operation == 'sync' && inputs.access_and_custody_confirmed == true && inputs.public_rights_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Advance only publicly licensed records with durable per-page checkpoints
        env:
          DECISION_OS_MARKET_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.market_collection_cli runtime --out "$RUNNER_TEMP/dos2-ashare-data"
      - name: Preserve only the engineering counts receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ashare-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-ashare-data/result.json
          if-no-files-found: warn
          retention-days: 7
