name: decision-os-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: dos2-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select scope and optional exact-base timing
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-runtime.py route --out "$RUNNER_TEMP/dos2-plan"
      - uses: ./.github/actions/ci-python
        if: steps.route.outputs.initial_scope != 'content'
        timeout-minutes: 10
        with:
          profile: dev
      - name: Record environment and qualify merge reuse
        if: steps.route.outputs.initial_scope != 'content'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci-runtime.py reuse --out "$RUNNER_TEMP/dos2-plan"
      - name: Collect full suite or execute qualified limited scope
        id: plan
        run: python .github/scripts/ci-runtime.py prepare --out "$RUNNER_TEMP/dos2-plan"
      - name: Preserve preparation and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-plan/
          retention-days: 30
          if-no-files-found: warn
  contracts:
    needs: prepare
    if: needs.prepare.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore this run's verified plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-runtime.py restore --out "$RUNNER_TEMP/dos2-contracts"
      - uses: ./.github/actions/ci-python
        timeout-minutes: 10
        with:
          profile: contracts
      - name: Execute small dependency contracts
        timeout-minutes: 6
        run: python .github/scripts/ci-runtime.py execute --group contracts --out "$RUNNER_TEMP/dos2-contracts"
      - name: Preserve contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-part-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dos2-contracts/
            !${{ runner.temp }}/dos2-contracts/plan.json
            !${{ runner.temp }}/dos2-contracts/durations-hint.json
          retention-days: 30
          if-no-files-found: warn
  remaining:
    needs: prepare
    if: needs.prepare.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore this run's verified plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-runtime.py restore --out "$RUNNER_TEMP/dos2-part"
      - uses: ./.github/actions/ci-python
        timeout-minutes: 10
        with:
          profile: dev
      - name: Execute native pytest-split with up to four workers
        timeout-minutes: 6
        env:
          CI_GROUP: ${{ matrix.group }}
        run: python .github/scripts/ci-runtime.py execute --group "$CI_GROUP" --out "$RUNNER_TEMP/dos2-part"
      - name: Preserve shard diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-part-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dos2-part/
            !${{ runner.temp }}/dos2-part/plan.json
            !${{ runner.temp }}/dos2-part/durations-hint.json
          retention-days: 30
          if-no-files-found: warn
  gate:
    name: CI Gate
    needs: [prepare, contracts, remaining]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        if: needs.prepare.outputs.scope != 'content'
        timeout-minutes: 10
        with:
          profile: contracts
      - name: Validate native outcomes and exact complete evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci-runtime.py gate --out "$RUNNER_TEMP/dos2-final"
      - name: Preserve final evidence and original partition archives
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-final/
          retention-days: 30
          if-no-files-found: warn
