name: decision-os-news-rolling
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'latest-desk discovers retained news without a Ref; other modes keep their exact original plans'
        type: choice
        options: [build, read, desk, read-desk, latest-desk]
        default: build
        required: false
      code_sha:
        description: 'Exact inspected main code SHA; only latest-desk may leave empty to pin the native main checkout'
        type: string
        required: false
        default: ''
      plan:
        description: 'Original exact JSON plan; latest-desk alone may leave empty (or use its exported fixed-snapshot history plan)'
        type: string
        required: false
        default: ''
      save:
        description: 'Preserve build metadata or a desk edition through the existing versioned writer'
        type: boolean
        default: false
        required: true
      public_metadata_custody_confirmed:
        description: 'This derived metadata may be public; not publisher full text or new collection'
        type: boolean
        default: false
        required: true
      public_feedback_custody_confirmed:
        description: 'Explicit selection notes may be public in both workflow output and records; never inferred from metadata rights'
        type: boolean
        default: false
        required: false
      public_research_custody_confirmed:
        description: 'Exact original research excerpts and limitations may be public; separate from news metadata rights, including read-only outputs'
        type: boolean
        default: false
        required: false
      public_sources_custody_confirmed:
        description: 'Retained industry observations and role evidence may be public; separate from research and feedback'
        type: boolean
        default: false
        required: false
      submission_id:
        description: 'Stable original intent for one save; empty for read-only build'
        type: string
        default: ''
      expected_head:
        description: 'Exact records SHA inspected before this save; empty for read-only build'
        type: string
        default: ''
permissions: {}
concurrency:
  group: decision-os-news-rolling
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && (inputs.operation == 'latest-desk' || !inputs.save || inputs.public_metadata_custody_confirmed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: dev
      - name: Reject write fields on the read-only News Desk entry
        if: inputs.operation == 'latest-desk'
        env:
          SAVE_REQUESTED: ${{ inputs.save }}
          SUBMISSION: ${{ inputs.submission_id }}
          RECORDS_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "$SAVE_REQUESTED" = false
          test -z "$SUBMISSION"
          test -z "$RECORDS_HEAD"
      - name: Verify exact main CI before building
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ inputs.code_sha }}
          NEWS_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$NEWS_OPERATION" = latest-desk ] && [ -z "$EXPECTED_CODE" ]; then
            EXPECTED_CODE="$GITHUB_SHA"
          fi
          test "$GITHUB_SHA" = "$EXPECTED_CODE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f event=push -f per_page=20 > "$RUNNER_TEMP/news-roll-ci.json"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/news-roll-ci.json') as f: runs=json.load(f)['workflow_runs']
          assert any(r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push' and r['path']=='.github/workflows/ci.yml' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success' for r in runs)
          PY
      - name: Build without write permission
        if: '!inputs.save'
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
          DOS2_NEWS_MODE: read
        run: python -m decision_kernel.interfaces.news_rolling_cli build --out "$RUNNER_TEMP/news-roll"
      - name: Read News Desk dates and bounded headlines in Actions
        if: success() && inputs.operation == 'latest-desk' && !inputs.save
        run: cat "$RUNNER_TEMP/news-roll/news-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain read-only result
        if: always() && !inputs.save
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-news-roll-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-roll/
          if-no-files-found: warn
          retention-days: 30
  save:
    needs: build
    if: inputs.save && inputs.public_metadata_custody_confirmed && inputs.operation != 'read' && inputs.operation != 'read-desk' && inputs.operation != 'latest-desk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: dev
      - name: Build and save via existing conditional source writer
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
          DOS2_NEWS_MODE: write
        run: python -m decision_kernel.interfaces.news_rolling_cli build --out "$RUNNER_TEMP/news-roll"
      - name: Preserve original input and confirmed or unknown save result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-news-roll-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-roll/
          if-no-files-found: warn
          retention-days: 30
