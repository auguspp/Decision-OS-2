name: odds-probability-development-sources
on:
  push:
    branches: [feat/60-probability-odds]
    paths: [.github/workflows/odds-probability-sources.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pack exact engineering tree, no data or credentials
        run: |
          mkdir "$RUNNER_TEMP/odds-sources"
          git archive --format=tar HEAD > "$RUNNER_TEMP/odds-sources/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/odds-sources/identity.txt"
          git init "$RUNNER_TEMP/old-kernel"
          git -C "$RUNNER_TEMP/old-kernel" remote add origin https://github.com/auguspp/decision-kernel.git
          git -C "$RUNNER_TEMP/old-kernel" fetch --depth=1 origin cb3bbc87eeeeadb6bf24d7adc8cc214cd80ab9b8
          git -C "$RUNNER_TEMP/old-kernel" archive --format=tar FETCH_HEAD src/decision_kernel > "$RUNNER_TEMP/odds-sources/old-kernel-src.tar"
          cd "$RUNNER_TEMP/odds-sources"
          sha256sum *.tar > sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: odds-probability-development-sources
          path: ${{ runner.temp }}/odds-sources/
          retention-days: 1
          if-no-files-found: error
