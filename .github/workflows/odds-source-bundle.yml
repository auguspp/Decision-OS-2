name: odds-development-source-bundle
on:
  push:
    branches: [feat/60-conditional-odds]
    paths: [.github/workflows/odds-source-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked engineering bytes only
        run: |
          mkdir -p "$RUNNER_TEMP/odds-sources"
          git archive --format=tar HEAD > "$RUNNER_TEMP/odds-sources/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/odds-sources/identity.txt"
          sha256sum "$RUNNER_TEMP/odds-sources/source.tar" > "$RUNNER_TEMP/odds-sources/sha256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: odds-development-sources
          path: ${{ runner.temp }}/odds-sources/
          retention-days: 1
