name: odds-watch-development-sources
on:
  push:
    branches: [feat/60-odds-watch]
    paths: [.github/workflows/odds-watch-sources.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive engineering bytes only
        run: |
          mkdir "$RUNNER_TEMP/odds-watch-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/odds-watch-source/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/odds-watch-source/identity.txt"
          cd "$RUNNER_TEMP/odds-watch-source"
          sha256sum source.tar > sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: odds-watch-development-sources
          path: ${{ runner.temp }}/odds-watch-source/
          retention-days: 1
