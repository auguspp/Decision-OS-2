name: decision-os-relay-source-runtime
run-name: ${{ inputs.family == 'market-bulk-check' && 'Relay bulk boundary 20261018' || 'decision-os-relay-source-runtime' }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan is offline; capture retains authorized rows; explicit checks do not write records'
        type: choice
        options: [plan, capture, check]
        default: plan
        required: true
      code_sha:
        description: 'Exact inspected main SHA; reject a changed code version'
        type: string
        required: true
      family:
        description: 'Typed source family, catalogue plan, or fixed private bulk diagnostic'
        type: choice
        options: [financial, participants, research, industry-pmi, market-bulk-check]
        default: financial
      codes:
        description: 'Typed families only: securities separated by spaces or commas'
        type: string
        required: false
      periods:
        description: 'Financial only: quarter-end YYYYMMDD periods'
        type: string
        required: false
      dates:
        description: 'Participants only: exact report or visit days YYYYMMDD, separated by spaces'
        type: string
        required: false
      apis:
        description: 'Space-separated names in chosen family; empty selects its 8 financial or 3 participant APIs'
        type: string
        default: ''
      page_size:
        description: 'Per-page size, validated by the existing source CLI'
        type: string
        default: '100'
      max_pages:
        description: 'Per-query safety bound; not a purchased-use quota'
        type: string
        default: '100'
      source_plan:
        description: 'Research/PMI plan, or fixed bulk diagnostic study identity; no credentials'
        type: string
        required: false
      access_confirmed:
        description: 'Explicit check authorization; bulk check requires native PRIVATE custody, not republication'
        type: boolean
        default: false
      public_rights_confirmed:
        description: 'Capture only: I authorize querying and retaining these data in this public repository artifacts'
        type: boolean
        default: false
        required: true
permissions: {}
concurrency:
  group: decision-os-relay-source
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.family != 'market-bulk-check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Validate selection and prepare without source credentials
        id: prepare
        run: python -m decision_kernel.interfaces.relay_source_runtime prepare --out "$RUNNER_TEMP/dos2-relay-source"
      - name: Explicit source capture with the repository secret
        if: inputs.operation == 'capture'
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.relay_source_runtime capture --out "$RUNNER_TEMP/dos2-relay-source"
      - name: Check retained PMI reference without exporting supplier rows
        if: inputs.family == 'industry-pmi' && inputs.operation == 'check'
        env:
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.relay_source_runtime check --out "$RUNNER_TEMP/dos2-relay-source"
      - name: Preserve selected plan and authorized complete or partial capture
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-relay-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-relay-source/
          if-no-files-found: error
          retention-days: 7
  bulk-check:
    if: github.repository == 'auguspp/Decision-OS-2' && github.ref == 'refs/heads/main' && inputs.family == 'market-bulk-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-python
        with:
          profile: contracts
      - name: Verify private target, fixed study, exact main CI and unused attempt before source credentials
        id: prepare
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
        run: python -m decision_kernel.interfaces.relay_bulk_check_cli prepare --out "$RUNNER_TEMP/dos2-relay-bulk"
      - name: Execute the finite private row-limit experiment without records writes or retries
        env:
          DECISION_OS_STORE_TOKEN: ${{ github.token }}
          TUSHARE_PROXY_API_KEY: ${{ secrets.TUSHARE_PROXY_API_KEY }}
        run: python -m decision_kernel.interfaces.relay_bulk_check_cli capture --out "$RUNNER_TEMP/dos2-relay-bulk"
      - name: Preserve original finite diagnostic and authenticated private bytes
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dos2-relay-bulk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dos2-relay-bulk/
          if-no-files-found: error
          retention-days: 7
