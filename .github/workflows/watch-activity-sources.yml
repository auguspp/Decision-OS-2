name: watch-activity-development-sources
on:
  push:
    branches: [feat/60-watch-activity]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pack engineering files only
        run: |
          mkdir "$RUNNER_TEMP/watch-sources"
          git archive --format=tar HEAD > "$RUNNER_TEMP/watch-sources/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/watch-sources/identity.txt"
          cd "$RUNNER_TEMP/watch-sources"
          sha256sum source.tar > sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watch-activity-development-sources
          path: ${{ runner.temp }}/watch-sources
          retention-days: 1
