[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-os-2"
version = "0.1.0"
description = "Decision OS 2.0 engineering and research kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rss = ["feedparser==6.0.14", "feedparser-sgmllib==2.1.0"]

[project.scripts]
decision-os = "decision_kernel.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decision_kernel*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
